name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Rename APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk DSTU-schedule.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSTU-schedule-apk
          path: DSTU-schedule.apk
          retention-days: 30

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('backend/version.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "Релиз v${{ steps.get_version.outputs.version }}"
          files: DSTU-schedule.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
